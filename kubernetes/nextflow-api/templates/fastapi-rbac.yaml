apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "edge-api.fullname" . }}-fastapi-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "edge-api.fullname" . }}-fastapi-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "edge-api.fullname" . }}-fastapi
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "edge-api.fullname" . }}-fastapi-role
  apiGroup: rbac.authorization.k8s.io
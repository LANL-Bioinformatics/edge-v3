{{- if .Values.nextflow.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "edge-api.fullname" . }}-nextflow-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "edge-api.fullname" . }}-nextflow-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.nextflow.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "edge-api.fullname" . }}-nextflow-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
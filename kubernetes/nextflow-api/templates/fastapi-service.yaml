apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-api.fullname" . }}-fastapi
  labels:
    {{- include "edge-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastapi
spec:
  type: {{ .Values.fastapi.service.type }}
  ports:
    - port: {{ .Values.fastapi.service.port }}
      targetPort: {{ .Values.fastapi.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "edge-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastapi
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp-stack.fullname" . }}-nginx-conf
data:
  default.conf: |
    server {
        listen 80;

        location / {
            proxy_pass http://{{ include "webapp-stack.fullname" . }}-web:{{ .Values.webApp.server.config.APP_SERVER_PORT }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
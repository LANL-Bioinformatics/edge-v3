server {
    server_name ${APP_EXTERNAL_HOSTNAME};
    server_tokens off;
    client_max_body_size 5000M;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://${APP_EXTERNAL_HOSTNAME}$request_uri;
    }
}
server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name ${APP_EXTERNAL_HOSTNAME};

    ssl_certificate /etc/letsencrypt/live/${APP_EXTERNAL_HOSTNAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_EXTERNAL_HOSTNAME}/privkey.pem;
    location / {
        proxy_pass  http://edgev3_app:5000;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    }
}